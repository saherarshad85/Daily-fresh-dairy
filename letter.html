<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letterhead — Daily Fresh Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #dfe4eb;
  font-family: 'Space Grotesk', sans-serif;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.print-btn {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 13px 24px;
  border-radius: 50px;
  background: linear-gradient(135deg, #1b5e20, #2e7d32);
  color: #FFFFFF;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.4);
  box-shadow: 0 12px 32px rgba(27,94,32,.45);
}
.print-btn:hover { transform: translateY(-3px); }

/* ============================================================
   A4 PAGE
============================================================ */
.page {
  width: 210mm;
  height: 297mm;
  background: #FFFFFF;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

/* Background image layer (gg.png) */
.bg-layer {
  position: absolute;
  inset: 0;
  background-image: url('gg.png'); 
  background-size: 210mm 297mm;
  background-position: center center;
  background-repeat: no-repeat;
  pointer-events: none;
  z-index: 0;
}

/* ✅ WATERMARK — Logo ka halka nishan (Peeche) */
.watermark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 140mm;
  height: 140mm;
  opacity: 0.06;
  z-index: 1;
  pointer-events: none;
}

.watermark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ============================================================
   TABLE LAYOUT
============================================================ */
.page-table {
  position: relative;
  z-index: 3;
  width: 100%;
  height: 100%;
  display: table;
  table-layout: fixed;
  border-collapse: collapse;
}

.table-row { display: table-row; }

.table-cell {
  display: table-cell;
  vertical-align: top;
  position: relative;
}

/* ============================================================
   HEADER ROW
============================================================ */
.header-row { height: 130mm; }

.header-cell {
  padding: 0mm 15mm 5mm 15mm;
  position: relative;
}

/* LOGO — Left side (Ab chota kar diya hai) */
.logo-block {
  position: absolute;
  top: -5mm;       /* Upar se adjust kiya */
  left: 6mm;
  width: 65mm;     /* Pehle 80mm tha, ab 65mm kar diya */
  height: 65mm;
  z-index: 3;
}

.logo-block img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* HEADER RIGHT — Contact Info */
.header-right {
  position: absolute;
  top: 10mm;
  right: 15mm;
  width: 90mm;
  z-index: 4;
}

.contact-item {
  display: flex;
  align-items: flex-start;
  gap: 3mm;
  margin-bottom: 4mm;
}

.contact-icon {
  width: 8mm;
  height: 8mm;
  border-radius: 50%;
  background: #1b5e20;
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10pt;
  flex-shrink: 0;
  margin-top: 1mm;
}

.contact-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11pt;
  font-weight: 500;
  color: #0B1B36;
  line-height: 1.3;
  display: flex;
  flex-direction: column;
  gap: 1mm;
}

.contact-text .small {
  font-size: 10pt;
  color: #4B5563;
}

/* ============================================================
   BODY ROW
============================================================ */
.body-row { height: 120mm; }

.body-cell {
  padding: 10mm 15mm;
  position: relative;
}

.content {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11pt;
  color: #0B1B36;
  line-height: 1.75;
}

.content p { margin-bottom: 4mm; }

/* ============================================================
   FOOTER ROW
============================================================ */
.footer-row { height: 47mm; }

.footer-cell {
  padding: 0mm 15mm 2mm 15mm;
  vertical-align: bottom;
  position: relative;
}

.footer-top-line {
  width: 100%;
  height: 0.4mm;
  background: #1b5e20;
  margin-bottom: 3mm;
}

.footer-content {
  display: flex;
  align-items: center;
  gap: 6mm;
  flex-wrap: wrap;
}

.footer-item {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10pt;
  font-weight: 500;
  color: #0B1B36;
  display: flex;
  align-items: center;
  gap: 2.5mm;
  white-space: nowrap;
}

.footer-item i {
  color: #1b5e20;
  font-size: 12pt;
  flex-shrink: 0;
}

.footer-sep {
  width: 0.3mm;
  height: 5mm;
  background: rgba(11,27,54,.3);
  flex-shrink: 0;
}

/* ============================================================
   PRINT
============================================================ */
@page {
    size: A4 portrait;
    margin: 0;
}

@media print {
    html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
    }

    body { display: block !important; }

    .print-btn { display: none !important; }

    .page {
        width: 210mm !important;
        height: 297mm !important;
        min-width: 210mm !important;
        min-height: 297mm !important;
        max-width: 210mm !important;
        max-height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        position: relative !important;
        overflow: hidden !important;
        box-shadow: none !important;
        transform: none !important;
    }

    .bg-layer {
        position: absolute !important;
        inset: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        background-size: 210mm 297mm !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
    }

    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }
}
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">
  <i class="fas fa-print"></i>
  <span>Print Letterhead</span>
</button>

<div class="page">

  <!-- Background (gg.png) -->
  <div class="bg-layer"></div>

  <!-- ✅ Watermark (logo.png - halka nishan) -->
  <div class="watermark">
    <img src="logo.png" alt="Watermark">
  </div>

  <div class="page-table">

    <!-- ==================== HEADER ROW ==================== -->
    <div class="table-row header-row">
      <div class="table-cell header-cell">

        <!-- LOGO (logo.png) -->
        <div class="logo-block">
          <img src="logo.png" alt="Daily Fresh Dairy">
        </div>

        <!-- HEADER RIGHT — Contact Info -->
        <div class="header-right">

          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
            <div class="contact-text">
              <span>Village and Post office Ganjian wali kallan</span>
              <span class="small">Tehsil and District Sialkot</span>
            </div>
          </div>

          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-envelope"></i></div>
            <div class="contact-text">
              <span>daily_freshdairy@hotmail.com</span>
            </div>
          </div>

          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-phone"></i></div>
            <div class="contact-text">
              <span>03349999114</span>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- ==================== BODY ROW ==================== -->
    <div class="table-row body-row">
      <div class="table-cell body-cell">
        <div class="content">
          <!-- Letter yahan type karein -->
        </div>
      </div>
    </div>

    <!-- ==================== FOOTER ROW ==================== -->
    <div class="table-row footer-row">
      <div class="table-cell footer-cell">

      

        <div class="footer-content">
          <div class="footer-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>Ganjianwali Kalan, Sialkot</span>
          </div>
          <div class="footer-sep"></div>
          <div class="footer-item">
            <i class="fas fa-envelope"></i>
            <span>daily_freshdairy@hotmail.com</span>
          </div>
          <div class="footer-sep"></div>
          <div class="footer-item">
            <i class="fas fa-phone"></i>
            <span>03349999114</span>
          </div>
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
